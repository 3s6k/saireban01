<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATLITE Electronic Siren Amplifier Simulator</title>
<style>
  :root {
    --panel-bg: #2b2d30;
    --panel-border: #1a1b1d;
    --bezel-color: #d1d5db;
    --btn-red: #cc0000;
    --btn-red-active: #ff3333;
    --btn-black: #111111;
    --led-red-off: #440000;
    --led-red-on: #ff0000;
  }

  body {
    background-color: #0f1012;
    color: #e5e7eb;
    font-family: 'Arial', 'Helvetica', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    user-select: none;
  }

  .amplifier-unit {
    background: var(--panel-bg);
    border: 4px solid var(--panel-border);
    border-radius: 12px;
    width: 680px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.1);
    position: relative;
  }

  .brand-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #404247;
    padding-bottom: 12px;
    margin-bottom: 24px;
  }

  .brand-title {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #f3f4f6;
  }

  .model-name {
    font-size: 14px;
    color: #9ca3af;
    font-family: monospace;
  }

  .control-panel {
    display: grid;
    grid-template-columns: 2fr 1fr 1.5fr;
    gap: 20px;
    align-items: center;
    background: #212326;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #374151;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    color: #9ca3af;
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 1px;
  }

  /* モード切り替えスイッチ */
  .rotary-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .rotary-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .btn {
    background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
    color: #ffffff;
    border: 1px solid #4b5563;
    padding: 12px;
    font-weight: bold;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 4px 0 #111827;
    transition: all 0.05s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #111827;
  }

  .btn.active {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    border-color: #60a5fa;
    box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
  }

  /* 手動サイレンボタン (赤色特大) */
  .manual-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .btn-danger {
    background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
    border: 2px solid #f87171;
    color: white;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 6px 0 #7f1d1d, 0 10px 15px rgba(0,0,0,0.5);
    cursor: pointer;
    outline: none;
  }

  .btn-danger:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #7f1d1d, 0 5px 10px rgba(0,0,0,0.5);
    background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
  }

  /* 停止・音量エリア */
  .system-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .btn-stop {
    background: linear-gradient(180deg, #4b5563 0%, #1f2937 100%);
    border-color: #6b7280;
    color: #ef4444;
  }

  .volume-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .volume-box label {
    font-size: 11px;
    color: #9ca3af;
  }

  input[type=range] {
    width: 100%;
    accent-color: #3b82f6;
  }

  /* モニター・インジケーター */
  .display-panel {
    margin-top: 20px;
    background: #000000;
    border: 2px solid #374151;
    border-radius: 6px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .status-text {
    font-family: monospace;
    color: #10b981;
    font-size: 14px;
  }
