<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATROL SIREN AMP SAP-500 PERFECT</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #0d0f12;
    color: #e0e0e0;
    font-family: monospace, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .panel {
    background: #181b22;
    border: 3px solid #2d323e;
    border-radius: 12px;
    padding: 24px;
    width: 350px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.9);
  }
  .display {
    background: #08090b;
    border: 1px solid #222630;
    border-radius: 6px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .status { font-size: 11px; font-weight: bold; color: #444; letter-spacing: 1px; }
  .status.active { color: #ff3344; text-shadow: 0 0 10px rgba(255, 51, 68, 0.6); }
  .freq { font-size: 15px; color: #00ff88; font-weight: bold; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .btn {
    height: 54px;
    background: #252934;
    border: 1px solid #3d4354;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 4px 0 #12141a;
  }
  .btn:active, .btn.active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #12141a;
  }
  .btn.red { background: #851414; border-color: #b91c1c; }
  .btn.red.active { background: #dc2626; }
</style>
</head>
<body>

<div class="panel">
  <div class="display">
    <span id="status" class="status">STANDBY</span>
    <span id="freq" class="freq">000 Hz</span>
  </div>
  <div class="grid">
    <button id="btn8" class="btn red">8秒周期</button>
    <button id="btn4" class="btn red">4秒周期</button>
    <button id="btnManual" class="btn">手動</button>
  </div>
</div>

<script>
  let ctx = null;
  let oscMain = null;   // 主音（300Hz〜750Hz Sawtooth）
  let oscHarmonic = null; // 高域倍音（オクターブ上）
  let gain = null;
  let filter = null;
  let mode = null, loopTimer = null, animReq = null;

  // 物理計算数値の設定
  const F_START = 300; // 始まり・最低音
  const F_MAX   = 750; // 最高音の主音
  const F_MIN   = 150; // 手動減衰の終点周波数

  function initAudio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }

  function startOsc() {
    stopOsc();
    oscMain = ctx.createOscillator();
    oscHarmonic = ctx.createOscillator();
    gain = ctx.createGain();
    filter = ctx.createBiquadFilter();

    // 波形設定
    oscMain.type = 'sawtooth';     // ズッシリ重い主音
    oscHarmonic.type = 'triangle'; // 高域に薄く混ざる高音成分

    // スピーカー通過後のバンドパス・ローパス特性（角を削りアンプ感を出す）
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2200, ctx.currentTime);

    // 初期音量
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);

    // ノード接続
    const harmGain = ctx.createGain();
    harmGain.gain.value = 0.25; // 倍音の混ざり具合（主音に対して25%）

    oscMain.connect(filter);
    oscHarmonic.connect(harmGain);
    harmGain.connect(filter);

    filter.connect(gain);
    gain.connect(ctx.destination);

    oscMain.start();
    oscHarmonic.start();
    updateFreqDisplay();
  }

  function stopOsc() {
    if (oscMain) {
      try { oscMain.stop(); oscHarmonic.stop(); } catch(e){}
      oscMain.disconnect(); oscHarmonic.disconnect(); filter.disconnect(); gain.disconnect();
      oscMain = null; oscHarmonic = null; filter = null; gain = null;
    }
    cancelAnimationFrame(animReq);
    document.getElementById('freq').textContent = "000 Hz";
  }

  function updateFreqDisplay() {
    if (oscMain) {
      document.getElementById('freq').textContent = Math.round(oscMain.frequency.value) + " Hz";
      animReq = requestAnimationFrame(updateFreqDisplay);
    }
  }

  function setStatus(text, active) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (active ? ' active' : '');
  }

  // 周波数を設定する関数（主音とオクターブ上の高音を連動）
  function setSirenFreq(freq, targetTime, rampType = 'linear') {
    const t = targetTime;
    if (rampType === 'exponential') {
      const safeFreq = Math.max(freq, 10);
      oscMain.frequency.exponentialRampToValueAtTime(safeFreq, t);
      oscHarmonic.frequency.exponentialRampToValueAtTime(safeFreq * 2.02, t);
    } else {
      oscMain.frequency.linearRampToValueAtTime(freq, t);
      oscHarmonic.frequency.linearRampToValueAtTime(freq * 2.02, t);
    }
  }

  // 自動（8秒 / 4秒周期）
  function toggleAuto(targetMode) {
    initAudio();
    if (mode === targetMode) { stopAll(); return; }
    stopAll();

    mode = targetMode;
    document.getElementById(targetMode === '8s' ? 'btn8' : 'btn4').classList.add('active');
    setStatus(targetMode.toUpperCase(), true);

    startOsc();
    const period = targetMode === '8s' ? 8.0 : 4.0;
    const half = period / 2;
    const now = ctx.currentTime;

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.1);

    function loop() {
      if (mode !== targetMode) return;
      const t = ctx.currentTime;
      oscMain.frequency.cancelScheduledValues(t);
      oscHarmonic.frequency.cancelScheduledValues(t);

      // 300Hz -> 750Hz -> 300Hz の連続周期
      setSirenFreq(F_MAX, t + half);
      setSirenFreq(F_START, t + period);

      loopTimer = setTimeout(loop, period * 1000);
    }

    oscMain.frequency.setValueAtTime(F_START, now);
    oscHarmonic.frequency.setValueAtTime(F_START * 2.02, now);
    loop();
  }

  // 手動：押下時（300Hzから750Hzへ上昇）
  function pressManual(e) {
    if (e) e.preventDefault();
    initAudio();
    if (mode === 'manual') return;
    stopAll();

    mode = 'manual';
    document.getElementById('btnManual').classList.add('active');
    setStatus("MANUAL", true);

    startOsc();
    const now = ctx.currentTime;

    oscMain.frequency.setValueAtTime(F_START, now);
    oscHarmonic.frequency.setValueAtTime(F_START * 2.02, now);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.08);

    // 押している間に300Hzから750Hzへ約2.5秒かけて吹け上がる
    setSirenFreq(F_MAX, now + 2.5);
  }

  // 手動：離した時（離した高さから150Hz付近へ下降して消音）
  function releaseManual(e) {
    if (e) e.preventDefault();
    if (mode !== 'manual') return;

    document.getElementById('btnManual').classList.remove('active');
    setStatus("STANDBY", false);

    if (!oscMain) { mode = null; return; }

    const now = ctx.currentTime;
    const currentF = oscMain.frequency.value;

    oscMain.frequency.cancelScheduledValues(now);
    oscHarmonic.frequency.cancelScheduledValues(now);

    oscMain.frequency.setValueAtTime(currentF, now);
    oscHarmonic.frequency.setValueAtTime(currentF * 2.02, now);

    // 離した瞬間の周波数から150Hz付近まで指数関数的に余韻を残して落ちる
    setSirenFreq(F_MIN, now + 2.6, 'exponential');

    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.linearRampToValueAtTime(0.0001, now + 2.6);

    setTimeout(() => {
      if (mode === 'manual') { stopOsc(); mode = null; }
    }, 2600);
  }

  function stopAll() {
    clearTimeout(loopTimer);
    document.getElementById('btn8').classList.remove('active');
    document.getElementById('btn4').classList.remove('active');
    document.getElementById('btnManual').classList.remove('active');
    setStatus("STANDBY", false);

    if (gain && mode !== 'manual') {
      const now = ctx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.linearRampToValueAtTime(0.0001, now + 0.4);
      setTimeout(stopOsc, 400);
    } else {
      stopOsc();
    }
    mode = null;
  }

  document.getElementById('btn8').addEventListener('click', () => toggleAuto('8s'));
  document.getElementById('btn4').addEventListener('click', () => toggleAuto('4s'));

  const mBtn = document.getElementById('btnManual');
  mBtn.addEventListener('mousedown', pressManual);
  mBtn.addEventListener('mouseup', releaseManual);
  mBtn.addEventListener('mouseleave', releaseManual);
  mBtn.addEventListener('touchstart', pressManual, {passive: false});
  mBtn.addEventListener('touchend', releaseManual, {passive: false});
</script>
</body>
</html>
