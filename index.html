<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATLITE SAP Series Siren Amp Emulator</title>
<style>
    :root {
        --bg-color: #0d0d11;
        --panel-bg: #1c1c24;
        --text-main: #e0e0e0;
        --text-muted: #777;
        --border-main: #333344;
        --accent-red: #ff3333;
        --accent-red-glow: rgba(255, 51, 51, 0.5);
        --accent-blue: #3399ff;
        --accent-blue-glow: rgba(51, 153, 255, 0.4);
        --accent-yellow: #ffbb33;
        --accent-yellow-glow: rgba(255, 187, 51, 0.4);
        --accent-green: #00ff66;
    }

    body {
        margin: 0;
        padding: 20px;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
    }

    .amp-case {
        background: var(--panel-bg);
        border: 2px solid var(--border-main);
        border-radius: 12px;
        padding: 25px;
        width: 100%;
        max-width: 800px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 1px 2px rgba(255,255,255,0.1);
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-main);
        padding-bottom: 15px;
    }

    .header h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 2px;
        color: #eee;
    }

    .header p {
        margin: 6px 0 0 0;
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 1px;
    }

    .visualizer-container {
        background: #000;
        border: 2px solid #222233;
        border-radius: 8px;
        margin-bottom: 25px;
        padding: 2px;
        position: relative;
        overflow: hidden;
    }

    canvas {
        width: 100%;
        height: 150px;
        display: block;
        border-radius: 4px;
    }

    .status-bar {
        position: absolute;
        bottom: 8px;
        left: 10px;
        font-family: monospace;
        font-size: 11px;
        color: var(--accent-green);
        text-shadow: 0 0 4px var(--accent-green);
        pointer-events: none;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 15px;
    }

    .control-group {
        background: #121218;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #282836;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .control-group h2 {
        margin: 0;
        font-size: 12px;
        color: #889;
        text-align: center;
        letter-spacing: 1px;
    }

    button {
        background: #252532;
        color: #ccc;
        border: 1.5px solid #444455;
        border-radius: 6px;
        padding: 14px 8px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.1s ease;
        outline: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    button:active {
        transform: translateY(1px);
    }

    .btn-auto.active {
        border-color: var(--accent-blue);
        color: var(--accent-blue);
        background: #182838;
        box-shadow: 0 0 12px var(--accent-blue-glow);
    }

    .btn-manual {
        border-color: #773333;
        color: #ffaaaa;
        height: 100%;
        min-height: 55px;
    }
    .btn-manual.active {
        border-color: var(--accent-red);
        color: var(--accent-red);
        background: #381818;
        box-shadow: 0 0 15px var(--accent-red-glow);
    }

    .btn-alarm.active {
        border-color: var(--accent-yellow);
        color: var(--accent-yellow);
        background: #382818;
        box-shadow: 0 0 12px var(--accent-yellow-glow);
    }

    .btn-stop {
        background: #381818;
        border-color: #662222;
        color: #ffaaaa;
    }
    .btn-stop:active {
        background: var(--accent-red);
        color: #fff;
    }
</style>
</head>
<body>

<div class="amp-case">
    <div class="header">
        <h1>PATLITE SAP SERIES EMULATOR</h1>
        <p>Standard Spec Calibrated Model (770Hz - 1020Hz)</p>
    </div>

    <div class="visualizer-container">
        <canvas id="visualizer"></canvas>
        <div id="status-text" class="status-bar">SYS_READY: STANDBY</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <h2>AUTO CYCLE</h2>
            <button id="btn-auto-4" class="btn-auto">4 SEC (PATROL)</button>
            <button id="btn-auto-8" class="btn-auto">8 SEC (HIGHWAY)</button>
        </div>

        <div class="control-group">
            <h2>MANUAL SWEEP</h2>
            <button id="btn-manual" class="btn-manual">MANUAL (WOO)<br><small>[Hold SPACE]</small></button>
        </div>

        <div class="control-group">
            <h2>OVERLAY ALARM</h2>
            <button id="btn-alarm" class="btn-alarm">INTERSECTION</button>
        </div>

        <div class="control-group">
            <h2>MASTER CONTROL</h2>
            <button id="btn-stop" class="btn-stop">ALL STOP</button>
        </div>
    </div>
</div>

<script>
/**
 * PATLITE SAP Series Siren Amp Spec Implementation
 * - Base Frequency: 770 Hz - 1020 Hz
 * - 4 Sec Cycle: Up 2.0s / Down 2.0s
 * - 8 Sec Cycle: Up 4.0s / Down 4.0s
 * - Manual Woo: Start 0 Hz -> 1020 Hz (1.3s) -> Decay 3.5s
 * - Intersection: 1200 Hz & 1550 Hz Dual Tone (11.5 Hz Modulation)
 */

let audioCtx = null;
let masterCompressor = null;
let analyser = null;

let autoManager = null;
let alarmVoice = null;
let activeManualVoices = [];
let currentManualVoice = null;
let manualKeyActive = false;

// 規格に基づく周波数定数
const FREQ_MIN = 770;      // 定常下限周波数
const FREQ_MAX = 1020;     // 定常上限周波数
const FREQ_OFF = 0.01;     // 完全消音時（0Hz近似）

class SirenVoice {
    constructor(ctx, destination) {
        this.ctx = ctx;
        this.nodes = [];
        
        // メイン出力ゲイン
        this.outputGain = ctx.createGain();
        this.outputGain.gain.value = 0;
        this.outputGain.connect(destination);
        this.nodes.push(this.outputGain);

        // バンドパスフィルタ（ホーンスピーカーの音響特性を再現）
        this.bandpass = ctx.createBiquadFilter();
        this.bandpass.type = 'bandpass';
        this.bandpass.frequency.value = 1500;
        this.bandpass.Q.value = 0.6;
        this.bandpass.connect(this.outputGain);
        this.nodes.push(this.bandpass);

        // 鋸形波（Sawtooth）+ 矩形波（Square）合成による金属ホーン音調再現
        this.oscSaw = ctx.createOscillator();
        this.oscSaw.type = 'sawtooth';
        
        this.oscSquare = ctx.createOscillator();
        this.oscSquare.type = 'square';

        const mixGainSquare = ctx.createGain();
        mixGainSquare.gain.value = 0.35;

        this.oscSaw.connect(this.bandpass);
        this.oscSquare.connect(mixGainSquare).connect(this.bandpass);
        
        this.nodes.push(this.oscSaw, this.oscSquare, mixGainSquare);

        const now = ctx.currentTime;
        this.oscSaw.start(now);
        this.oscSquare.start(now);
    }

    setFrequencyAtTime(freq, time) {
        const clamped = Math.max(FREQ_OFF, freq);
        this.oscSaw.frequency.setValueAtTime(clamped, time);
        this.oscSquare.frequency.setValueAtTime(clamped, time);
    }

    linearRampToFrequencyAtTime(freq, time) {
        const clamped = Math.max(FREQ_OFF, freq);
        this.oscSaw.frequency.linearRampToValueAtTime(clamped, time);
        this.oscSquare.frequency.linearRampToValueAtTime(clamped, time);
    }

    setFrequencyTargetAtTime(targetFreq, time, timeConstant) {
        const clamped = Math.max(FREQ_OFF, targetFreq);
        this.oscSaw.frequency.setTargetAtTime(clamped, time, timeConstant);
        this.oscSquare.frequency.setTargetAtTime(clamped, time, timeConstant);
    }

    cancelSchedules(time) {
        if (typeof this.outputGain.gain.cancelAndHoldAtTime === 'function') {
            this.outputGain.gain.cancelAndHoldAtTime(time);
            this.oscSaw.frequency.cancelAndHoldAtTime(time);
            this.oscSquare.frequency.cancelAndHoldAtTime(time);
        } else {
            this.outputGain.gain.cancelScheduledValues(time);
            this.oscSaw.frequency.cancelScheduledValues(time);
            this.oscSquare.frequency.cancelScheduledValues(time);
        }
    }

    fadeAndDestroy(durationSec = 0.2) {
        const now = this.ctx.currentTime;
        this.cancelSchedules(now);
        this.outputGain.gain.setTargetAtTime(0, now, durationSec / 3);
        setTimeout(() => this.destroy(), durationSec * 1000 + 100);
    }

    destroy() {
        this.nodes.forEach(node => {
            try {
                if (node.stop) node.stop();
                node.disconnect();
            } catch (e) {}
        });
    }
}

class AutoSirenManager {
    constructor(ctx, destination, cycleLengthSec) {
        this.ctx = ctx;
        this.cycleLength = cycleLengthSec; // 4.0s または 8.0s
        this.halfCycle = cycleLengthSec / 2.0; // 2.0s または 4.0s
        this.voice = new SirenVoice(ctx, destination);
        
        const now = ctx.currentTime;
        this.voice.setFrequencyAtTime(FREQ_MIN, now);
        this.voice.outputGain.gain.setValueAtTime(0, now);
        this.voice.outputGain.gain.linearRampToValueAtTime(1.0, now + 0.05);

        this.isRunning = true;
        this.nextScheduleTime = now;
        this.scheduleId = null;
        
        this._scheduleLoop();
    }

    _scheduleLoop() {
        if (!this.isRunning) return;
        const now = this.ctx.currentTime;
        const lookAhead = 2.0;
        
        while (this.nextScheduleTime < now + lookAhead) {
            const t = this.nextScheduleTime;
            
            // 規格通り正確な線形直線スイープ（直線増減）
            this.voice.setFrequencyAtTime(FREQ_MIN, t);
            this.voice.linearRampToFrequencyAtTime(FREQ_MAX, t + this.halfCycle);
            this.voice.linearRampToFrequencyAtTime(FREQ_MIN, t + this.cycleLength);
            
            this.nextScheduleTime += this.cycleLength;
        }
        
        this.scheduleId = setTimeout(() => this._scheduleLoop(), 200);
    }
    
    stop() {
        this.isRunning = false;
        clearTimeout(this.scheduleId);
        this.voice.fadeAndDestroy(0.2);
    }
}

class IntersectionAlarmVoice {
    constructor(ctx, destination) {
        this.ctx = ctx;
        this.nodes = [];
        
        this.master = ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(destination);
        this.nodes.push(this.master);
        
        const modGain = ctx.createGain();
        modGain.gain.value = 0; 
        modGain.connect(this.master);
        this.nodes.push(modGain);
        
        // 規格仕様: 11.5Hz 断続モジュレーション
        const lfo = ctx.createOscillator();
        lfo.type = 'square';
        lfo.frequency.value = 11.5; 
        
        const dc = ctx.createConstantSource();
        dc.offset.value = 1;
        
        lfo.connect(modGain.gain);
        dc.connect(modGain.gain);
        this.nodes.push(lfo, dc);
        
        // 規格仕様: 1200Hz ＆ 1550Hz 複合音
        const freqs = [1200, 1550]; 
        freqs.forEach(f => {
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = f;
            
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = f;
            bp.Q.value = 4.0;
            
            osc.connect(bp).connect(modGain);
            this.nodes.push(osc, bp);
            osc.start();
        });
        lfo.start();
        dc.start();
    }
    
    start() {
        const now = this.ctx.currentTime;
        this.master.gain.setValueAtTime(0, now);
        this.master.gain.linearRampToValueAtTime(0.5, now + 0.03);
    }
    
    stop() {
        const now = this.ctx.currentTime;
        if (typeof this.master.gain.cancelAndHoldAtTime === 'function') {
            this.master.gain.cancelAndHoldAtTime(now);
        } else {
            this.master.gain.cancelScheduledValues(now);
        }
        this.master.gain.setTargetAtTime(0, now, 0.05);
        
        setTimeout(() => {
            this.nodes.forEach(n => {
                try {
                    if (n.stop) n.stop();
                    n.disconnect();
                } catch(e) {}
            });
        }, 300);
    }
}

// UI ＆ コントロール
const btnAuto4 = document.getElementById('btn-auto-4');
const btnAuto8 = document.getElementById('btn-auto-8');
const btnManual = document.getElementById('btn-manual');
const btnAlarm = document.getElementById('btn-alarm');
const btnStop = document.getElementById('btn-stop');
const statusText = document.getElementById('status-text');

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    masterCompressor = audioCtx.createDynamicsCompressor();
    masterCompressor.threshold.value = -6;
    masterCompressor.knee.value = 6;
    masterCompressor.ratio.value = 12;
    masterCompressor.attack.value = 0.005;
    masterCompressor.release.value = 0.08;
    
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    
    masterCompressor.connect(analyser);
    analyser.connect(audioCtx.destination);
    
    drawVisualizer();
}

function toggleAuto(is4Sec) {
    initAudio();
    const cycle = is4Sec ? 4 : 8;
    const targetBtn = is4Sec ? btnAuto4 : btnAuto8;
    const otherBtn  = is4Sec ? btnAuto8 : btnAuto4;
    
    if (autoManager) {
        const wasSame = (autoManager.cycleLength === cycle);
        autoManager.stop();
        autoManager = null;
        targetBtn.classList.remove('active');
        otherBtn.classList.remove('active');
        if (wasSame) return; 
    }
    
    autoManager = new AutoSirenManager(audioCtx, masterCompressor, cycle);
    targetBtn.classList.add('active');
}

function startManual() {
    initAudio();
    if (manualKeyActive) return;
    manualKeyActive = true;
    btnManual.classList.add('active');

    while (activeManualVoices.length >= 2) {
        const oldestVoice = activeManualVoices.shift();
        oldestVoice.fadeAndDestroy(0.15);
    }

    const voice = new SirenVoice(audioCtx, masterCompressor);
    const now = audioCtx.currentTime;
    
    // 手動仕様: 0Hzから立ち上がり、約1.3秒で1020Hzへ全開到達
    voice.setFrequencyAtTime(FREQ_OFF, now);
    voice.outputGain.gain.setValueAtTime(0, now);
    voice.outputGain.gain.linearRampToValueAtTime(1.0, now + 0.05);
    
    voice.setFrequencyTargetAtTime(FREQ_MAX, now, 0.45);

    activeManualVoices.push(voice);
    currentManualVoice = voice;
}

function releaseManual() {
    manualKeyActive = false;
    btnManual.classList.remove('active');
    
    if (currentManualVoice) {
        const voice = currentManualVoice;
        const now = audioCtx.currentTime;
        
        voice.cancelSchedules(now);
        
        // 手動余韻仕様: 離してから約3.5秒かけて0Hzまで減衰
        voice.setFrequencyTargetAtTime(FREQ_OFF, now, 0.8);
        voice.outputGain.gain.setTargetAtTime(0, now, 0.85); 
        
        setTimeout(() => {
            voice.destroy();
            const idx = activeManualVoices.indexOf(voice);
            if (idx > -1) activeManualVoices.splice(idx, 1);
        }, 3800);
        
        currentManualVoice = null;
    }
}

function toggleAlarm() {
    initAudio();
    if (alarmVoice) {
        alarmVoice.stop();
        alarmVoice = null;
        btnAlarm.classList.remove('active');
    } else {
        alarmVoice = new IntersectionAlarmVoice(audioCtx, masterCompressor);
        alarmVoice.start();
        btnAlarm.classList.add('active');
    }
}

function stopAll() {
    if (autoManager) {
        autoManager.stop();
        autoManager = null;
        btnAuto4.classList.remove('active');
        btnAuto8.classList.remove('active');
    }
    if (alarmVoice) {
        alarmVoice.stop();
        alarmVoice = null;
        btnAlarm.classList.remove('active');
    }
    
    activeManualVoices.forEach(voice => voice.fadeAndDestroy(0.1));
    activeManualVoices = [];
    currentManualVoice = null;
    manualKeyActive = false;
    btnManual.classList.remove('active');
}

btnAuto4.addEventListener('click', () => toggleAuto(true));
btnAuto8.addEventListener('click', () => toggleAuto(false));
btnAlarm.addEventListener('click', toggleAlarm);
btnStop.addEventListener('click', stopAll);

btnManual.addEventListener('mousedown', startManual);
btnManual.addEventListener('mouseup', releaseManual);
btnManual.addEventListener('mouseleave', releaseManual);
btnManual.addEventListener('touchstart', (e) => { e.preventDefault(); startManual(); }, { passive: false });
btnManual.addEventListener('touchend', (e) => { e.preventDefault(); releaseManual(); }, { passive: false });

window.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
        e.preventDefault();
        startManual();
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        releaseManual();
    }
});

// Canvas Visualizer
const canvas = document.getElementById('visualizer');
const ctxCanvas = canvas.getContext('2d');

function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctxCanvas.scale(dpr, dpr);
    }
    
    const w = rect.width;
    const h = rect.height;

    ctxCanvas.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctxCanvas.fillRect(0, 0, w, h);

    if (!analyser) return;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(dataArray);

    ctxCanvas.lineWidth = 2;
    ctxCanvas.strokeStyle = '#00ff66';
    ctxCanvas.beginPath();

    const sliceWidth = w * 1.0 / bufferLength;
    let x = 0;

    for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * (h / 2);
        if (i === 0) {
            ctxCanvas.moveTo(x, y);
        } else {
            ctxCanvas.lineTo(x, y);
        }
        x += sliceWidth;
    }

    ctxCanvas.lineTo(w, h / 2);
    ctxCanvas.stroke();
    
    const autoStatus = autoManager ? `${autoManager.cycleLength}S` : 'OFF';
    const manCnt = activeManualVoices.length;
    const almStatus = alarmVoice ? 'ON' : 'OFF';
    statusText.textContent = `SYS_STATUS: [AUTO: ${autoStatus}] [MANUAL_VOICES: ${manCnt}] [INTERSECTION: ${almStatus}]`;
}

ctxCanvas.fillStyle = '#000';
ctxCanvas.fillRect(0, 0, canvas.width, canvas.height);
</script>

</body>
</html>
