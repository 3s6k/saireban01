<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PATROL SIREN AMP SAP-500</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .amp-panel {
    background: linear-gradient(180deg, #2c2c2c 0%, #141414 100%);
    border: 4px solid #3d3d3d;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.2);
    width: 360px;
  }
  .header {
    border-bottom: 2px solid #111;
    padding-bottom: 10px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title { font-size: 13px; font-weight: bold; letter-spacing: 2px; color: #bbb; }
  .model { font-size: 10px; color: #666; font-family: monospace; }
  .display {
    background: #000;
    border: 1px solid #222;
    border-radius: 6px;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .indicator { display: flex; align-items: center; gap: 8px; }
  .led { width: 10px; height: 10px; background: #222; border-radius: 50%; border: 1px solid #111; }
  .led.active { background: #ff2222; box-shadow: 0 0 10px #ff2222; }
  .status-text { font-size: 10px; font-weight: bold; color: #555; letter-spacing: 1px; }
  .freq { font-family: monospace; font-size: 14px; color: #00ff66; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .btn-box { display: flex; flex-direction: column; align-items: center; }
  .btn {
    width: 85px; height: 55px;
    border-radius: 6px; border: 2px solid #111;
    background: linear-gradient(180deg, #444 0%, #222 100%);
    color: #fff; font-weight: bold; font-size: 12px;
    cursor: pointer; outline: none;
    box-shadow: 0 4px 0 #000, 0 5px 8px rgba(0,0,0,0.6);
    transition: all 0.05s ease;
  }
  .btn:active, .btn.active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #000, 0 2px 4px rgba(0,0,0,0.6);
  }
  .btn.red { background: linear-gradient(180deg, #d32f2f 0%, #8b0000 100%); }
  .btn.red:active, .btn.red.active { background: linear-gradient(180deg, #f44336 0%, #ab0000 100%); }
  .label { font-size: 9px; color: #777; margin-top: 6px; font-weight: bold; }
</style>
</head>
<body>

<div class="amp-panel">
  <div class="header">
    <div class="title">PATLITE</div>
    <div class="model">SAP-500 SPEC</div>
  </div>

  <div class="display">
    <div class="indicator">
      <div id="led" class="led"></div>
      <span id="statusText" class="status-text">STANDBY</span>
    </div>
    <div id="freq" class="freq">000 Hz</div>
  </div>

  <div class="grid">
    <div class="btn-box">
      <button id="btn8" class="btn red">8秒周期</button>
      <span class="btn-label">自動切替</span>
    </div>
    <div class="btn-box">
      <button id="btn4" class="btn red">4秒周期</button>
      <span class="btn-label">自動切替</span>
    </div>
    <div class="btn-box">
      <button id="btnManual" class="btn">手 動</button>
      <span class="btn-label">押下時吹鳴</span>
    </div>
  </div>
</div>

<script>
  let audioCtx = null, oscSaw = null, oscSquare = null, gainNode = null, filterNode = null;
  let mode = null, timer = null, animFrame = null;

  const F_LOW = 770, F_HIGH = 960, F_MIN = 250;

  async function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
  }

  function startEngine() {
    if (oscSaw) stopEngine();
    oscSaw = audioCtx.createOscillator();
    oscSquare = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    filterNode = audioCtx.createBiquadFilter();

    oscSaw.type = 'sawtooth';
    oscSquare.type = 'square';
    filterNode.type = 'lowpass';
    filterNode.frequency.setValueAtTime(1800, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);

    oscSaw.connect(filterNode);
    oscSquare.connect(filterNode);
    filterNode.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscSaw.start();
    oscSquare.start();
    updateFreq();
  }

  function stopEngine() {
    if (oscSaw) {
      try { oscSaw.stop(); oscSquare.stop(); } catch(e){}
      oscSaw.disconnect(); oscSquare.disconnect();
      filterNode.disconnect(); gainNode.disconnect();
      oscSaw = null; oscSquare = null; filterNode = null; gainNode = null;
    }
    cancelAnimationFrame(animFrame);
    document.getElementById('freq').textContent = "000 Hz";
  }

  function updateFreq() {
    if (oscSaw) {
      document.getElementById('freq').textContent = Math.round(oscSaw.frequency.value) + " Hz";
      animFrame = requestAnimationFrame(updateFreq);
    }
  }

  function setUI(active, text) {
    const led = document.getElementById('led');
    const statusText = document.getElementById('statusText');
    if (active) {
      led.classList.add('active');
      statusText.textContent = text;
      statusText.style.color = "#ff4d5a";
    } else {
      led.classList.remove('active');
      statusText.textContent = "STANDBY";
      statusText.style.color = "#555";
    }
  }

  // 手動
  async function pressManual(e) {
    if (e) e.preventDefault();
    await initAudio();
    if (mode === '8s' || mode === '4s') stopAuto();
    if (mode === 'manual') return;

    mode = 'manual';
    document.getElementById('btnManual').classList.add('active');
    setUI(true, "MANUAL");

    startEngine();
    const now = audioCtx.currentTime;

    oscSaw.frequency.setValueAtTime(F_LOW, now);
    oscSquare.frequency.setValueAtTime(F_LOW * 1.002, now);

    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(0.001, now);
    gainNode.gain.linearRampToValueAtTime(0.35, now + 0.08);

    oscSaw.frequency.linearRampToValueAtTime(F_HIGH, now + 2.2);
    oscSquare.frequency.linearRampToValueAtTime(F_HIGH * 1.002, now + 2.2);
  }

  function releaseManual(e) {
    if (e) e.preventDefault();
    if (mode !== 'manual') return;

    document.getElementById('btnManual').classList.remove('active');
    setUI(false);

    if (!oscSaw) { mode = null; return; }

    const now = audioCtx.currentTime;
    const curFreq = oscSaw.frequency.value;

    oscSaw.frequency.cancelScheduledValues(now);
    oscSquare.frequency.cancelScheduledValues(now);
    oscSaw.frequency.setValueAtTime(curFreq, now);
    oscSquare.frequency.setValueAtTime(curFreq * 1.002, now);

    oscSaw.frequency.exponentialRampToValueAtTime(F_MIN, now + 2.0);
    oscSquare.frequency.exponentialRampToValueAtTime(F_MIN * 1.002, now + 2.0);

    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0.0001, now + 2.0);

    setTimeout(() => {
      if (mode === 'manual') { stopEngine(); mode = null; }
    }, 2000);
  }

  // 自動 (8s/4s)
  async function toggleAuto(targetMode) {
    await initAudio();
    if (mode === targetMode) { stopAuto(); return; }
    if (mode === 'manual') releaseManual();
    if (mode === '8s' || mode === '4s') stopAuto();

    mode = targetMode;
    document.getElementById(targetMode === '8s' ? 'btn8' : 'btn4').classList.add('active');
    setUI(true, targetMode.toUpperCase());

    startEngine();

    const period = targetMode === '8s' ? 8.0 : 4.0;
    const half = period / 2;

    const now = audioCtx.currentTime;
    gainNode.gain.setValueAtTime(0.001, now);
    gainNode.gain.linearRampToValueAtTime(0.35, now + 0.1);

    function loop() {
      if (mode !== targetMode) return;
      const t = audioCtx.currentTime;
      oscSaw.frequency.cancelScheduledValues(t);
      oscSquare.frequency.cancelScheduledValues(t);

      oscSaw.frequency.linearRampToValueAtTime(F_HIGH, t + half);
      oscSquare.frequency.linearRampToValueAtTime(F_HIGH * 1.002, t + half);
      oscSaw.frequency.linearRampToValueAtTime(F_LOW, t + period);
      oscSquare.frequency.linearRampToValueAtTime(F_LOW * 1.002, t + period);

      timer = setTimeout(loop, period * 1000);
    }

    oscSaw.frequency.setValueAtTime(F_LOW, now);
    oscSquare.frequency.setValueAtTime(F_LOW * 1.002, now);
    loop();
  }

  function stopAuto() {
    if (mode === '8s' || mode === '4s') {
      document.getElementById('btn8').classList.remove('active');
      document.getElementById('btn4').classList.remove('active');
      setUI(false);
      clearTimeout(timer);

      if (gainNode) {
        const now = audioCtx.currentTime;
        oscSaw.frequency.cancelScheduledValues(now);
        oscSquare.frequency.cancelScheduledValues(now);
        oscSaw.frequency.linearRampToValueAtTime(F_MIN, now + 1.2);
        oscSquare.frequency.linearRampToValueAtTime(F_MIN * 1.002, now + 1.2);

        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(0.0001, now + 1.2);

        setTimeout(stopEngine, 1200);
      }
      mode = null;
    }
  }

  const btn8 = document.getElementById('btn8');
  const btn4 = document.getElementById('btn4');
  const btnManual = document.getElementById('btnManual');

  btn8.addEventListener('click', () => toggleAuto('8s'));
  btn4.addEventListener('click', () => toggleAuto('4s'));

  btnManual.addEventListener('mousedown', pressManual);
  btnManual.addEventListener('mouseup', releaseManual);
  btnManual.addEventListener('mouseleave', releaseManual);
  btnManual.addEventListener('touchstart', pressManual, {passive: false});
  btnManual.addEventListener('touchend', releaseManual, {passive: false});
</script>
</body>
</html>
