<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSP SIREN AMP - PATLITE Emulator</title>
<style>
    :root {
        --bg-color: #0a0a0c;
        --panel-bg: #1a1a20;
        --text-main: #e0e0e0;
        --text-muted: #666;
        --border-main: #333;
        --accent-red: #ff3333;
        --accent-red-glow: rgba(255, 51, 51, 0.6);
        --accent-blue: #33aaff;
        --accent-blue-glow: rgba(51, 170, 255, 0.4);
        --accent-yellow: #ffaa33;
        --accent-yellow-glow: rgba(255, 170, 51, 0.4);
        --accent-green: #33ff66;
    }

    body {
        margin: 0;
        padding: 20px;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
    }

    .amp-case {
        background: var(--panel-bg);
        border: 2px solid var(--border-main);
        border-radius: 12px;
        padding: 25px;
        width: 100%;
        max-width: 800px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.05);
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-main);
        padding-bottom: 15px;
    }

    .header h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 3px;
        color: #ddd;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .header p {
        margin: 5px 0 0 0;
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 1px;
    }

    .visualizer-container {
        background: #000;
        border: 3px solid #222;
        border-radius: 8px;
        margin-bottom: 25px;
        padding: 2px;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 20px rgba(51, 255, 102, 0.1);
    }

    canvas {
        width: 100%;
        height: 160px;
        display: block;
        border-radius: 4px;
    }

    .status-bar {
        position: absolute;
        bottom: 8px;
        left: 10px;
        font-family: monospace;
        font-size: 12px;
        color: var(--accent-green);
        text-shadow: 0 0 5px var(--accent-green);
        pointer-events: none;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 20px;
    }

    .control-group {
        background: #111;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .control-group h2 {
        margin: 0;
        font-size: 13px;
        color: #888;
        text-align: center;
        letter-spacing: 1px;
    }

    button {
        background: #222;
        color: #ccc;
        border: 2px solid #444;
        border-radius: 6px;
        padding: 16px 10px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.1s ease;
        text-shadow: 1px 1px 2px #000;
        outline: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    button:active {
        transform: translateY(2px);
    }

    /* Auto Buttons */
    .btn-auto:hover { border-color: #557799; color: #fff; }
    .btn-auto.active {
        border-color: var(--accent-blue);
        color: var(--accent-blue);
        background: #1a2a3a;
        box-shadow: 0 0 15px var(--accent-blue-glow), inset 0 0 10px rgba(0,0,0,0.5);
    }

    /* Manual Button */
    .btn-manual {
        border-color: #733;
        color: #f88;
        height: 100%;
        min-height: 60px;
    }
    .btn-manual:hover { border-color: #944; color: #fbb; }
    .btn-manual.active {
        border-color: var(--accent-red);
        color: var(--accent-red);
        background: #3a1a1a;
        box-shadow: 0 0 20px var(--accent-red-glow), inset 0 0 10px rgba(0,0,0,0.5);
    }

    /* Alarm Button */
    .btn-alarm.active {
        border-color: var(--accent-yellow);
        color: var(--accent-yellow);
        background: #3a2a1a;
        box-shadow: 0 0 15px var(--accent-yellow-glow), inset 0 0 10px rgba(0,0,0,0.5);
    }

    /* Stop Button */
    .btn-stop {
        background: #3a1a1a;
        border-color: #622;
        color: #faa;
    }
    .btn-stop:hover { background: #522; color: #fff; }
    .btn-stop:active {
        background: var(--accent-red);
        color: #fff;
    }
    
    .instruction {
        margin-top: 20px;
        font-size: 12px;
        color: #555;
        text-align: center;
    }
</style>
</head>
<body>

<div class="amp-case">
    <div class="header">
        <h1>DSP SIREN AMP</h1>
        <p>Acoustic Physical Behavior & Polyphonic Emulator</p>
    </div>

    <div class="visualizer-container">
        <canvas id="visualizer"></canvas>
        <div id="status-text" class="status-bar">SYS_READY: STANDBY</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <h2>AUTO CYCLE</h2>
            <button id="btn-auto-4" class="btn-auto">4 SEC (PATROL)</button>
            <button id="btn-auto-8" class="btn-auto">8 SEC (HIGHWAY)</button>
        </div>

        <div class="control-group">
            <h2>MANUAL SWEEP</h2>
            <button id="btn-manual" class="btn-manual">MANUAL (WOO)<br><small>[Hold SPACE]</small></button>
        </div>

        <div class="control-group">
            <h2>OVERLAY ALARM</h2>
            <button id="btn-alarm" class="btn-alarm">INTERSECTION</button>
        </div>

        <div class="control-group">
            <h2>MASTER CONTROL</h2>
            <button id="btn-stop" class="btn-stop">ALL STOP</button>
        </div>
    </div>
    
    <div class="instruction">
        * RC充放電カーブに基づく指数関数的スイープと、重音(多重発音)ポリフォニック制御を完全再現。<br>
        手動ボタンを連打・長押しして、音が減衰しながら重なるアナログ回路特有の挙動を確認してください。
    </div>
</div>

<script>
/**
 * DSP SIREN AMP EMULATOR
 * 実機のコンデンサ充放電カーブ(時定数)、複数オシレーター波形合成、
 * ポリフォニック(多重発音)の減衰重なりを1から100まで純粋なWeb Audio APIで再現。
 */

// ==========================================
// 1. グローバル・オーディオ・コンテキスト
// ==========================================
let audioCtx = null;
let masterCompressor = null;
let analyser = null;

// ==========================================
// 2. 状態管理変数
// ==========================================
let autoManager = null;
let alarmVoice = null;
let activeManualVoices = [];
let currentManualVoice = null;
let manualKeyActive = false;

// 警察庁仕様に基づく周波数(Hz)
const FREQ_MIN = 770;
const FREQ_MAX = 1350;
const FREQ_PEAK_TARGET = 1450; // 漸近ターゲット（丸みを帯びたカーブを得るため少し高め）
const FREQ_LOW_TARGET = 650;   // 下降時の漸近ターゲット

// ==========================================
// 3. コア・シンセシス・クラス (SirenVoice)
// ==========================================
class SirenVoice {
    constructor(ctx, destination) {
        this.ctx = ctx;
        this.nodes = [];
        this.freqParams = [];
        
        // --- ゲイン(ボリューム)制御 ---
        this.outputGain = ctx.createGain();
        this.outputGain.gain.value = 0;
        this.outputGain.connect(destination);
        this.nodes.push(this.outputGain);

        // --- フィルター群 (ホーンスピーカー特有の中域の強調と低音カット) ---
        this.lowpass = ctx.createBiquadFilter();
        this.lowpass.type = 'lowpass';
        this.lowpass.frequency.value = 3500;
        this.lowpass.Q.value = 1.2;

        this.highpass = ctx.createBiquadFilter();
        this.highpass.type = 'highpass';
        this.highpass.frequency.value = 400;

        this.lowpass.connect(this.highpass).connect(this.outputGain);
        this.nodes.push(this.lowpass, this.highpass);

        // --- オシレーター合成 (実機の太い音色を再現) ---
        this.mixGain = ctx.createGain();
        this.mixGain.gain.value = 0.8;
        this.mixGain.connect(this.lowpass);
        this.nodes.push(this.mixGain);

        // 1. 基音 (Sawtooth)
        this.osc1 = ctx.createOscillator();
        this.osc1.type = 'sawtooth';
        this.osc1.connect(this.mixGain);
        this.freqParams.push({ param: this.osc1.frequency, ratio: 1.0 });

        // 2. サブ1 (Square - 太さと硬さを追加, 微デチューン)
        this.osc2 = ctx.createOscillator();
        this.osc2.type = 'square';
        this.osc2.detune.value = 15; // +15 cents
        const gain2 = ctx.createGain();
        gain2.gain.value = 0.6;
        this.osc2.connect(gain2).connect(this.mixGain);
        this.freqParams.push({ param: this.osc2.frequency, ratio: 1.0 });

        // 3. サブ2 (Square - 1オクターブ下で重厚感を演出)
        this.osc3 = ctx.createOscillator();
        this.osc3.type = 'square';
        const gain3 = ctx.createGain();
        gain3.gain.value = 0.4;
        this.osc3.connect(gain3).connect(this.mixGain);
        this.freqParams.push({ param: this.osc3.frequency, ratio: 0.5 }); // ratio 0.5で1オクターブ下

        this.nodes.push(this.osc1, this.osc2, this.osc3, gain2, gain3);

        // 全オシレーター起動
        const now = ctx.currentTime;
        this.osc1.start(now);
        this.osc2.start(now);
        this.osc3.start(now);
    }

    /** 指定時刻に周波数を即時セット */
    setFrequencyAtTime(baseFreq, time) {
        this.freqParams.forEach(f => {
            f.param.setValueAtTime(baseFreq * f.ratio, time);
        });
    }

    /** コンデンサ充放電曲線をシミュレートする漸近カーブ (指数関数) */
    setFrequencyTargetAtTime(targetBaseFreq, time, timeConstant) {
        this.freqParams.forEach(f => {
            f.param.setTargetAtTime(targetBaseFreq * f.ratio, time, timeConstant);
        });
    }

    /** スケジュールされたパラメーター変更をキャンセル */
    cancelSchedules(time) {
        // 最近のブラウザ向け cancelAndHoldAtTime
        if (typeof this.outputGain.gain.cancelAndHoldAtTime === 'function') {
            this.outputGain.gain.cancelAndHoldAtTime(time);
            this.freqParams.forEach(f => f.param.cancelAndHoldAtTime(time));
        } else {
            // Fallback
            this.outputGain.gain.cancelScheduledValues(time);
            this.freqParams.forEach(f => f.param.cancelScheduledValues(time));
        }
    }

    /** 即時停止とリソース解放 */
    destroy() {
        this.nodes.forEach(node => {
            try {
                if (node.stop) node.stop();
                node.disconnect();
            } catch (e) {}
        });
    }
}

// ==========================================
// 4. 自動サイレン管理者 (ルックアヘッド・スケジューラ)
// ==========================================
class AutoSirenManager {
    constructor(ctx, destination, cycleLengthSec) {
        this.ctx = ctx;
        this.cycleLength = cycleLengthSec;
        this.voice = new SirenVoice(ctx, destination);
        
        const now = ctx.currentTime;
        this.voice.setFrequencyAtTime(FREQ_MIN, now);
        this.voice.outputGain.gain.setValueAtTime(0, now);
        this.voice.outputGain.gain.linearRampToValueAtTime(1.0, now + 0.05);

        this.isRunning = true;
        this.nextScheduleTime = now;
        this.scheduleId = null;
        
        this._scheduleLoop();
    }

    _scheduleLoop() {
        if (!this.isRunning) return;
        const now = this.ctx.currentTime;
        const lookAhead = 1.5; // 1.5秒先まで先行スケジュール
        
        while (this.nextScheduleTime < now + lookAhead) {
            const t = this.nextScheduleTime;
            const halfCycle = this.cycleLength / 2.0;
            
            // 時定数(tau)の計算: 4秒周期(half=2)の場合、約2秒で到達するような時定数
            const ratio = halfCycle / 2.0;
            const tauUp = 1.04 * ratio;
            const tauDown = 1.13 * ratio;
            
            // 周期の開始地点で下限周波数にバインド (連続性を担保しつつズレを防ぐ)
            this.voice.setFrequencyAtTime(FREQ_MIN, t);
            
            // 上昇フェーズ (指数関数的カーブ)
            this.voice.setFrequencyTargetAtTime(FREQ_PEAK_TARGET, t, tauUp);
            // 下降フェーズ (指数関数的カーブ)
            this.voice.setFrequencyTargetAtTime(FREQ_LOW_TARGET, t + halfCycle, tauDown);
            
            this.nextScheduleTime += this.cycleLength;
        }
        
        // JSメインスレッドのタイマーで定期的にチェック
        this.scheduleId = setTimeout(() => this._scheduleLoop(), 200);
    }
    
    stop() {
        this.isRunning = false;
        clearTimeout(this.scheduleId);
        
        const now = this.ctx.currentTime;
        this.voice.cancelSchedules(now);
        // 急激に切るとノイズが乗るため、短時間でフェードアウト
        this.voice.outputGain.gain.setTargetAtTime(0, now, 0.05);
        
        setTimeout(() => this.voice.destroy(), 500);
    }
}

// ==========================================
// 5. 交差点警報音 (ハーモニック・オーバーレイ)
// ==========================================
class IntersectionAlarmVoice {
    constructor(ctx, destination) {
        this.ctx = ctx;
        this.nodes = [];
        
        this.master = ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(destination);
        this.nodes.push(this.master);
        
        // AM変調用ゲイン (LFOでON/OFFを切り替える)
        const modGain = ctx.createGain();
        modGain.gain.value = 0; 
        modGain.connect(this.master);
        this.nodes.push(modGain);
        
        // 12Hzの矩形波LFOで「ピピピピ」という断続音を作る
        const lfo = ctx.createOscillator();
        lfo.type = 'square';
        lfo.frequency.value = 12; 
        
        // ConstantSource (オフセット1) と LFO (-1〜1) を足して 0〜2 の変調信号を作る
        const dc = ctx.createConstantSource();
        dc.offset.value = 1;
        
        lfo.connect(modGain.gain);
        dc.connect(modGain.gain);
        
        this.lfo = lfo;
        this.dc = dc;
        this.nodes.push(lfo, dc);
        
        // 警報用の高音和音 (パトカー特有の不協和和音)
        const freqs = [1600, 2100]; 
        this.oscs = [];
        freqs.forEach(f => {
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = f;
            
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = f;
            bp.Q.value = 2.0;
            
            osc.connect(bp).connect(modGain);
            this.oscs.push(osc);
            this.nodes.push(osc, bp);
        });
    }
    
    start() {
        const now = this.ctx.currentTime;
        this.master.gain.setValueAtTime(0, now);
        this.master.gain.linearRampToValueAtTime(0.5, now + 0.05); // 主音より少し下げる
        
        this.lfo.start(now);
        this.dc.start(now);
        this.oscs.forEach(o => o.start(now));
    }
    
    stop() {
        const now = this.ctx.currentTime;
        if (typeof this.master.gain.cancelAndHoldAtTime === 'function') {
            this.master.gain.cancelAndHoldAtTime(now);
        } else {
            this.master.gain.cancelScheduledValues(now);
        }
        this.master.gain.setTargetAtTime(0, now, 0.05);
        
        setTimeout(() => {
            this.nodes.forEach(n => {
                try {
                    if (n.stop) n.stop();
                    n.disconnect();
                } catch(e) {}
            });
        }, 500);
    }
}

// ==========================================
// 6. UI制御 ＆ オーディオ初期化
// ==========================================
const btnAuto4 = document.getElementById('btn-auto-4');
const btnAuto8 = document.getElementById('btn-auto-8');
const btnManual = document.getElementById('btn-manual');
const btnAlarm = document.getElementById('btn-alarm');
const btnStop = document.getElementById('btn-stop');
const statusText = document.getElementById('status-text');

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // マスターコンプレッサー (多重発音時のクリッピング防止とサチュレーション付加)
    masterCompressor = audioCtx.createDynamicsCompressor();
    masterCompressor.threshold.value = -12;
    masterCompressor.knee.value = 10;
    masterCompressor.ratio.value = 12;
    masterCompressor.attack.value = 0.01;
    masterCompressor.release.value = 0.1;
    
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    
    masterCompressor.connect(analyser);
    analyser.connect(audioCtx.destination);
    
    drawVisualizer();
}

function toggleAuto(is4Sec) {
    initAudio();
    const cycle = is4Sec ? 4 : 8;
    const targetBtn = is4Sec ? btnAuto4 : btnAuto8;
    const otherBtn  = is4Sec ? btnAuto8 : btnAuto4;
    
    // すでに鳴っている場合
    if (autoManager) {
        const wasSame = (autoManager.cycleLength === cycle);
        autoManager.stop();
        autoManager = null;
        targetBtn.classList.remove('active');
        otherBtn.classList.remove('active');
        
        // 同じボタンなら停止して終了（トグル）
        if (wasSame) return; 
    }
    
    // 新規開始
    autoManager = new AutoSirenManager(audioCtx, masterCompressor, cycle);
    targetBtn.classList.add('active');
}

// === 手動（ウー）多重発音ロジック ===
function startManual() {
    initAudio();
    if (manualKeyActive) return; // 重複発火防止
    manualKeyActive = true;
    btnManual.classList.add('active');

    const voice = new SirenVoice(audioCtx, masterCompressor);
    const now = audioCtx.currentTime;
    
    // 立ち上がり
    voice.setFrequencyAtTime(FREQ_MIN, now);
    voice.outputGain.gain.setValueAtTime(0, now);
    voice.outputGain.gain.linearRampToValueAtTime(1.0, now + 0.05);
    
    // アナログ回路同様の充電カーブで最高周波数へ向かう (時定数 1.04)
    voice.setFrequencyTargetAtTime(FREQ_PEAK_TARGET, now, 1.04);

    activeManualVoices.push(voice);
    currentManualVoice = voice;
}

function releaseManual() {
    manualKeyActive = false;
    btnManual.classList.remove('active');
    
    if (currentManualVoice) {
        const voice = currentManualVoice;
        const now = audioCtx.currentTime;
        
        // 進行中の上昇スケジュールをキャンセル
        voice.cancelSchedules(now);
        
        // 惰性下降カーブ (時定数 1.13)
        voice.setFrequencyTargetAtTime(FREQ_LOW_TARGET, now, 1.13);
        
        // ゆっくりフェードアウト (惰性で鳴り続ける)
        voice.outputGain.gain.setTargetAtTime(0, now, 1.2); 
        
        // 完全に消えた頃に配列から削除して破棄
        setTimeout(() => {
            voice.destroy();
            const idx = activeManualVoices.indexOf(voice);
            if (idx > -1) activeManualVoices.splice(idx, 1);
        }, 5000);
        
        // 参照を切ることで、減衰中に再Pressされたら新しいVoiceが作られる（ポリフォニック）
        currentManualVoice = null;
    }
}

function toggleAlarm() {
    initAudio();
    if (alarmVoice) {
        alarmVoice.stop();
        alarmVoice = null;
        btnAlarm.classList.remove('active');
    } else {
        alarmVoice = new IntersectionAlarmVoice(audioCtx, masterCompressor);
        alarmVoice.start();
        btnAlarm.classList.add('active');
    }
}

function stopAll() {
    if (autoManager) {
        autoManager.stop();
        autoManager = null;
        btnAuto4.classList.remove('active');
        btnAuto8.classList.remove('active');
    }
    if (alarmVoice) {
        alarmVoice.stop();
        alarmVoice = null;
        btnAlarm.classList.remove('active');
    }
    
    // 手動ボイスはフェードアウトではなく即時強制停止
    const now = audioCtx ? audioCtx.currentTime : 0;
    activeManualVoices.forEach(voice => {
        voice.cancelSchedules(now);
        voice.outputGain.gain.setTargetAtTime(0, now, 0.05);
        setTimeout(() => voice.destroy(), 500);
    });
    activeManualVoices = [];
    currentManualVoice = null;
    manualKeyActive = false;
    btnManual.classList.remove('active');
}

// イベントリスナー登録
btnAuto4.addEventListener('click', () => toggleAuto(true));
btnAuto8.addEventListener('click', () => toggleAuto(false));
btnAlarm.addEventListener('click', toggleAlarm);
btnStop.addEventListener('click', stopAll);

// 手動ボタン (マウス / タッチ)
btnManual.addEventListener('mousedown', startManual);
btnManual.addEventListener('mouseup', releaseManual);
btnManual.addEventListener('mouseleave', releaseManual);
btnManual.addEventListener('touchstart', (e) => { e.preventDefault(); startManual(); }, { passive: false });
btnManual.addEventListener('touchend', (e) => { e.preventDefault(); releaseManual(); }, { passive: false });

// キーボード対応 (Space, Enter)
window.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
        e.preventDefault(); // スクロール防止
        startManual();
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        releaseManual();
    }
});

// ==========================================
// 7. ビジュアライザ (Canvas描画)
// ==========================================
const canvas = document.getElementById('visualizer');
const ctxCanvas = canvas.getContext('2d');

function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    
    // キャンバスのリサイズ対応
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctxCanvas.scale(dpr, dpr);
    }
    
    const w = rect.width;
    const h = rect.height;

    // 残像効果クリア
    ctxCanvas.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctxCanvas.fillRect(0, 0, w, h);

    if (!analyser) return;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(dataArray);

    ctxCanvas.lineWidth = 2;
    ctxCanvas.strokeStyle = '#33ff66';
    ctxCanvas.beginPath();

    const sliceWidth = w * 1.0 / bufferLength;
    let x = 0;

    for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * (h / 2);
        if (i === 0) {
            ctxCanvas.moveTo(x, y);
        } else {
            ctxCanvas.lineTo(x, y);
        }
        x += sliceWidth;
    }

    ctxCanvas.lineTo(w, h / 2);
    ctxCanvas.stroke();
    
    // ステータス更新
    const autoCnt = autoManager ? 1 : 0;
    const manCnt = activeManualVoices.length;
    const almCnt = alarmVoice ? 1 : 0;
    statusText.textContent = `SYS_STATUS: [AUTO:${autoCnt}] [MANUAL_VOICE:${manCnt}] [ALARM:${almCnt}]`;
}

// 初回描画開始
ctxCanvas.fillStyle = '#000';
ctxCanvas.fillRect(0, 0, canvas.width, canvas.height);
</script>
