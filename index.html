<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSP SIREN AMP - 200Hz Low-Pitch Calibrated Model</title>
<style>
    :root {
        --bg-color: #0a0a0c;
        --panel-bg: #1a1a20;
        --text-main: #e0e0e0;
        --text-muted: #666;
        --border-main: #333;
        --accent-red: #ff3333;
        --accent-red-glow: rgba(255, 51, 51, 0.6);
        --accent-blue: #33aaff;
        --accent-blue-glow: rgba(51, 170, 255, 0.4);
        --accent-yellow: #ffaa33;
        --accent-yellow-glow: rgba(255, 170, 51, 0.4);
        --accent-green: #33ff66;
    }

    body {
        margin: 0;
        padding: 20px;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
    }

    .amp-case {
        background: var(--panel-bg);
        border: 2px solid var(--border-main);
        border-radius: 12px;
        padding: 25px;
        width: 100%;
        max-width: 800px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.05);
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-main);
        padding-bottom: 15px;
    }

    .header h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 3px;
        color: #ddd;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .header p {
        margin: 5px 0 0 0;
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 1px;
    }

    .visualizer-container {
        background: #000;
        border: 3px solid #222;
        border-radius: 8px;
        margin-bottom: 25px;
        padding: 2px;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 20px rgba(51, 255, 102, 0.1);
    }

    canvas {
        width: 100%;
        height: 160px;
        display: block;
        border-radius: 4px;
    }

    .status-bar {
        position: absolute;
        bottom: 8px;
        left: 10px;
        font-family: monospace;
        font-size: 12px;
        color: var(--accent-green);
        text-shadow: 0 0 5px var(--accent-green);
        pointer-events: none;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 20px;
    }

    .control-group {
        background: #111;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .control-group h2 {
        margin: 0;
        font-size: 13px;
        color: #888;
        text-align: center;
        letter-spacing: 1px;
    }

    button {
        background: #222;
        color: #ccc;
        border: 2px solid #444;
        border-radius: 6px;
        padding: 16px 10px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.1s ease;
        text-shadow: 1px 1px 2px #000;
        outline: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    button:active {
        transform: translateY(2px);
    }

    .btn-auto:hover { border-color: #557799; color: #fff; }
    .btn-auto.active {
        border-color: var(--accent-blue);
        color: var(--accent-blue);
        background: #1a2a3a;
        box-shadow: 0 0 15px var(--accent-blue-glow), inset 0 0 10px rgba(0,0,0,0.5);
    }

    .btn-manual {
        border-color: #733;
        color: #f88;
        height: 100%;
        min-height: 60px;
    }
    .btn-manual:hover { border-color: #944; color: #fbb; }
    .btn-manual.active {
        border-color: var(--accent-red);
        color: var(--accent-red);
        background: #3a1a1a;
        box-shadow: 0 0 20px var(--accent-red-glow), inset 0 0 10px rgba(0,0,0,0.5);
    }

    .btn-alarm.active {
        border-color: var(--accent-yellow);
        color: var(--accent-yellow);
        background: #3a2a1a;
        box-shadow: 0 0 15px var(--accent-yellow-glow), inset 0 0 10px rgba(0,0,0,0.5);
    }

    .btn-stop {
        background: #3a1a1a;
        border-color: #622;
        color: #faa;
    }
    .btn-stop:hover { background: #522; color: #fff; }
    .btn-stop:active {
        background: var(--accent-red);
        color: #fff;
    }
    
    .instruction {
        margin-top: 20px;
        font-size: 12px;
        color: #666;
        text-align: center;
        line-height: 1.5;
    }
</style>
</head>
<body>

<div class="amp-case">
    <div class="header">
        <h1>DSP SIREN AMP</h1>
        <p>PATLITE / SAP Series Extra-Low Pitch (200Hz Start) Calibrated Model</p>
    </div>

    <div class="visualizer-container">
        <canvas id="visualizer"></canvas>
        <div id="status-text" class="status-bar">SYS_READY: STANDBY</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <h2>AUTO CYCLE</h2>
            <button id="btn-auto-4" class="btn-auto">4 SEC (PATROL)</button>
            <button id="btn-auto-8" class="btn-auto">8 SEC (HIGHWAY)</button>
        </div>

        <div class="control-group">
            <h2>MANUAL SWEEP</h2>
            <button id="btn-manual" class="btn-manual">MANUAL (WOO)<br><small>[Hold SPACE]</small></button>
        </div>

        <div class="control-group">
            <h2>OVERLAY ALARM</h2>
            <button id="btn-alarm" class="btn-alarm">INTERSECTION</button>
        </div>

        <div class="control-group">
            <h2>MASTER CONTROL</h2>
            <button id="btn-stop" class="btn-stop">ALL STOP</button>
        </div>
    </div>
    
    <div class="instruction">
        ・最低周波数を約200Hzに調整。超低音域からの重厚な立ち上がりを再現。<br>
        ・ボイス上限2音制限とフィルタ調整により、低音域でも音が潰れずクリアに再生。
    </div>
</div>

<script>
/**
 * DSP SIREN AMP EMULATOR (200Hz Low-Pitch Version)
 */

let audioCtx = null;
let masterCompressor = null;
let analyser = null;

let autoManager = null;
let alarmVoice = null;
let activeManualVoices = [];
let currentManualVoice = null;
let manualKeyActive = false;

// 最低周波数を約200Hzまで引き下げた周波数設定
const FREQ_START = 200;      // 手動（ウー）押し始めの超低音（200Hz）
const FREQ_AUTO_MIN = 600;   // 自動サイレン時の下限
const FREQ_PEAK_TARGET = 1360; // 上限ターゲット（最高約1350Hz）
const FREQ_LOW_TARGET = 180;   // 減衰時の漸近ターゲット（200Hz付近に滑らかに着地）

class SirenVoice {
    constructor(ctx, destination) {
        this.ctx = ctx;
        this.nodes = [];
        this.freqParams = [];
        
        // Output Gain
        this.outputGain = ctx.createGain();
        this.outputGain.gain.value = 0;
        this.outputGain.connect(destination);
        this.nodes.push(this.outputGain);

        // 200Hzの重低音を通すようハイパスフィルタのカットオフ周波数を下げて調整
        this.lowpass = ctx.createBiquadFilter();
        this.lowpass.type = 'lowpass';
        this.lowpass.frequency.value = 2200;
        this.lowpass.Q.value = 0.8;

        this.highpass = ctx.createBiquadFilter();
        this.highpass.type = 'highpass';
        this.highpass.frequency.value = 150; // 200Hz以下の不要な超低域ノイズのみカット

        this.lowpass.connect(this.highpass).connect(this.outputGain);
        this.nodes.push(this.lowpass, this.highpass);

        // 波形合成
        this.mixGain = ctx.createGain();
        this.mixGain.gain.value = 0.75;
        this.mixGain.connect(this.lowpass);
        this.nodes.push(this.mixGain);

        // 1. 基音 (Sawtooth)
        this.osc1 = ctx.createOscillator();
        this.osc1.type = 'sawtooth';
        this.osc1.connect(this.mixGain);
        this.freqParams.push({ param: this.osc1.frequency, ratio: 1.0 });

        // 2. 芯を太くする矩形波
        this.osc2 = ctx.createOscillator();
        this.osc2.type = 'square';
        this.osc2.detune.value = 6;
        const gain2 = ctx.createGain();
        gain2.gain.value = 0.5;
        this.osc2.connect(gain2).connect(this.mixGain);
        this.freqParams.push({ param: this.osc2.frequency, ratio: 1.0 });

        // 3. 低音域の厚みを補強するサブ（三角波）
        this.osc3 = ctx.createOscillator();
        this.osc3.type = 'triangle';
        const gain3 = ctx.createGain();
        gain3.gain.value = 0.4;
        this.osc3.connect(gain3).connect(this.mixGain);
        this.freqParams.push({ param: this.osc3.frequency, ratio: 0.5 });

        this.nodes.push(this.osc1, this.osc2, this.osc3, gain2, gain3);

        const now = ctx.currentTime;
        this.osc1.start(now);
        this.osc2.start(now);
        this.osc3.start(now);
    }

    setFrequencyAtTime(baseFreq, time) {
        this.freqParams.forEach(f => {
            f.param.setValueAtTime(baseFreq * f.ratio, time);
        });
    }

    setFrequencyTargetAtTime(targetBaseFreq, time, timeConstant) {
        this.freqParams.forEach(f => {
            f.param.setTargetAtTime(targetBaseFreq * f.ratio, time, timeConstant);
        });
    }

    cancelSchedules(time) {
        if (typeof this.outputGain.gain.cancelAndHoldAtTime === 'function') {
            this.outputGain.gain.cancelAndHoldAtTime(time);
            this.freqParams.forEach(f => f.param.cancelAndHoldAtTime(time));
        } else {
            this.outputGain.gain.cancelScheduledValues(time);
            this.freqParams.forEach(f => f.param.cancelScheduledValues(time));
        }
    }

    fadeAndDestroy(durationSec = 0.2) {
        const now = this.ctx.currentTime;
        this.cancelSchedules(now);
        this.outputGain.gain.setTargetAtTime(0, now, durationSec / 3);
        setTimeout(() => this.destroy(), durationSec * 1000 + 100);
    }

    destroy() {
        this.nodes.forEach(node => {
            try {
                if (node.stop) node.stop();
                node.disconnect();
            } catch (e) {}
        });
    }
}

class AutoSirenManager {
    constructor(ctx, destination, cycleLengthSec) {
        this.ctx = ctx;
        this.cycleLength = cycleLengthSec;
        this.voice = new SirenVoice(ctx, destination);
        
        const now = ctx.currentTime;
        this.voice.setFrequencyAtTime(FREQ_AUTO_MIN, now);
        this.voice.outputGain.gain.setValueAtTime(0, now);
        this.voice.outputGain.gain.linearRampToValueAtTime(1.0, now + 0.05);

        this.isRunning = true;
        this.nextScheduleTime = now;
        this.scheduleId = null;
        
        this._scheduleLoop();
    }

    _scheduleLoop() {
        if (!this.isRunning) return;
        const now = this.ctx.currentTime;
        const lookAhead = 1.5;
        
        while (this.nextScheduleTime < now + lookAhead) {
            const t = this.nextScheduleTime;
            const halfCycle = this.cycleLength / 2.0;
            const ratio = halfCycle / 2.0;
            const tauUp = 0.65 * ratio;
            const tauDown = 0.70 * ratio;

            this.voice.setFrequencyAtTime(FREQ_AUTO_MIN, t);
            this.voice.setFrequencyTargetAtTime(FREQ_PEAK_TARGET, t, tauUp);
            this.voice.setFrequencyTargetAtTime(FREQ_LOW_TARGET, t + halfCycle, tauDown);
            
            this.nextScheduleTime += this.cycleLength;
        }
        
        this.scheduleId = setTimeout(() => this._scheduleLoop(), 200);
    }
    
    stop() {
        this.isRunning = false;
        clearTimeout(this.scheduleId);
        this.voice.fadeAndDestroy(0.2);
    }
}

class IntersectionAlarmVoice {
    constructor(ctx, destination) {
        this.ctx = ctx;
        this.nodes = [];
        
        this.master = ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(destination);
        this.nodes.push(this.master);
        
        const modGain = ctx.createGain();
        modGain.gain.value = 0; 
        modGain.connect(this.master);
        this.nodes.push(modGain);
        
        const lfo = ctx.createOscillator();
        lfo.type = 'square';
        lfo.frequency.value = 11.5; 
        
        const dc = ctx.createConstantSource();
        dc.offset.value = 1;
        
        lfo.connect(modGain.gain);
        dc.connect(modGain.gain);
        
        this.lfo = lfo;
        this.dc = dc;
        this.nodes.push(lfo, dc);
        
        const freqs = [1200, 1550]; 
        this.oscs = [];
        freqs.forEach(f => {
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = f;
            
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = f;
            bp.Q.value = 3.0;
            
            osc.connect(bp).connect(modGain);
            this.oscs.push(osc);
            this.nodes.push(osc, bp);
        });
    }
    
    start() {
        const now = this.ctx.currentTime;
        this.master.gain.setValueAtTime(0, now);
        this.master.gain.linearRampToValueAtTime(0.45, now + 0.05);
        
        this.lfo.start(now);
        this.dc.start(now);
        this.oscs.forEach(o => o.start(now));
    }
    
    stop() {
        const now = this.ctx.currentTime;
        if (typeof this.master.gain.cancelAndHoldAtTime === 'function') {
            this.master.gain.cancelAndHoldAtTime(now);
        } else {
            this.master.gain.cancelScheduledValues(now);
        }
        this.master.gain.setTargetAtTime(0, now, 0.05);
        
        setTimeout(() => {
            this.nodes.forEach(n => {
                try {
                    if (n.stop) n.stop();
                    n.disconnect();
                } catch(e) {}
            });
        }, 500);
    }
}

// UI ＆ Control
const btnAuto4 = document.getElementById('btn-auto-4');
const btnAuto8 = document.getElementById('btn-auto-8');
const btnManual = document.getElementById('btn-manual');
const btnAlarm = document.getElementById('btn-alarm');
const btnStop = document.getElementById('btn-stop');
const statusText = document.getElementById('status-text');

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    masterCompressor = audioCtx.createDynamicsCompressor();
    masterCompressor.threshold.value = -10;
    masterCompressor.knee.value = 8;
    masterCompressor.ratio.value = 10;
    masterCompressor.attack.value = 0.01;
    masterCompressor.release.value = 0.1;
    
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    
    masterCompressor.connect(analyser);
    analyser.connect(audioCtx.destination);
    
    drawVisualizer();
}

function toggleAuto(is4Sec) {
    initAudio();
    const cycle = is4Sec ? 4 : 8;
    const targetBtn = is4Sec ? btnAuto4 : btnAuto8;
    const otherBtn  = is4Sec ? btnAuto8 : btnAuto4;
    
    if (autoManager) {
        const wasSame = (autoManager.cycleLength === cycle);
        autoManager.stop();
        autoManager = null;
        targetBtn.classList.remove('active');
        otherBtn.classList.remove('active');
        if (wasSame) return; 
    }
    
    autoManager = new AutoSirenManager(audioCtx, masterCompressor, cycle);
    targetBtn.classList.add('active');
}

function startManual() {
    initAudio();
    if (manualKeyActive) return;
    manualKeyActive = true;
    btnManual.classList.add('active');

    // 最大同時発音数を 2 音に制限
    while (activeManualVoices.length >= 2) {
        const oldestVoice = activeManualVoices.shift();
        oldestVoice.fadeAndDestroy(0.2);
    }

    const voice = new SirenVoice(audioCtx, masterCompressor);
    const now = audioCtx.currentTime;
    
    // 超低音（200Hz）からスタート
    voice.setFrequencyAtTime(FREQ_START, now);
    voice.outputGain.gain.setValueAtTime(0, now);
    voice.outputGain.gain.linearRampToValueAtTime(1.0, now + 0.05);
    
    // 200Hzから最高点（1360Hzターゲット）へ充電カーブで急上昇（時定数 0.75）
    voice.setFrequencyTargetAtTime(FREQ_PEAK_TARGET, now, 0.75);

    activeManualVoices.push(voice);
    currentManualVoice = voice;
}

function releaseManual() {
    manualKeyActive = false;
    btnManual.classList.remove('active');
    
    if (currentManualVoice) {
        const voice = currentManualVoice;
        const now = audioCtx.currentTime;
        
        voice.cancelSchedules(now);
        
        // 惰性下降 (超低音に向かって減衰)
        voice.setFrequencyTargetAtTime(FREQ_LOW_TARGET, now, 0.80);
        voice.outputGain.gain.setTargetAtTime(0, now, 0.9); 
        
        setTimeout(() => {
            voice.destroy();
            const idx = activeManualVoices.indexOf(voice);
            if (idx > -1) activeManualVoices.splice(idx, 1);
        }, 3500);
        
        currentManualVoice = null;
    }
}

function toggleAlarm() {
    initAudio();
    if (alarmVoice) {
        alarmVoice.stop();
        alarmVoice = null;
        btnAlarm.classList.remove('active');
    } else {
        alarmVoice = new IntersectionAlarmVoice(audioCtx, masterCompressor);
        alarmVoice.start();
        btnAlarm.classList.add('active');
    }
}

function stopAll() {
    if (autoManager) {
        autoManager.stop();
        autoManager = null;
        btnAuto4.classList.remove('active');
        btnAuto8.classList.remove('active');
    }
    if (alarmVoice) {
        alarmVoice.stop();
        alarmVoice = null;
        btnAlarm.classList.remove('active');
    }
    
    activeManualVoices.forEach(voice => voice.fadeAndDestroy(0.1));
    activeManualVoices = [];
    currentManualVoice = null;
    manualKeyActive = false;
    btnManual.classList.remove('active');
}

btnAuto4.addEventListener('click', () => toggleAuto(true));
btnAuto8.addEventListener('click', () => toggleAuto(false));
btnAlarm.addEventListener('click', toggleAlarm);
btnStop.addEventListener('click', stopAll);

btnManual.addEventListener('mousedown', startManual);
btnManual.addEventListener('mouseup', releaseManual);
btnManual.addEventListener('mouseleave', releaseManual);
btnManual.addEventListener('touchstart', (e) => { e.preventDefault(); startManual(); }, { passive: false });
btnManual.addEventListener('touchend', (e) => { e.preventDefault(); releaseManual(); }, { passive: false });

window.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
        e.preventDefault();
        startManual();
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        releaseManual();
    }
});

// Canvas Visualizer
const canvas = document.getElementById('visualizer');
const ctxCanvas = canvas.getContext('2d');

function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctxCanvas.scale(dpr, dpr);
    }
    
    const w = rect.width;
    const h = rect.height;

    ctxCanvas.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctxCanvas.fillRect(0, 0, w, h);

    if (!analyser) return;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(dataArray);

    ctxCanvas.lineWidth = 2;
    ctxCanvas.strokeStyle = '#33ff66';
    ctxCanvas.beginPath();

    const sliceWidth = w * 1.0 / bufferLength;
    let x = 0;

    for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * (h / 2);
        if (i === 0) {
            ctxCanvas.moveTo(x, y);
        } else {
            ctxCanvas.lineTo(x, y);
        }
        x += sliceWidth;
    }

    ctxCanvas.lineTo(w, h / 2);
    ctxCanvas.stroke();
    
    const autoCnt = autoManager ? 1 : 0;
    const manCnt = activeManualVoices.length;
    const almCnt = alarmVoice ? 1 : 0;
    statusText.textContent = `SYS_STATUS: [AUTO:${autoCnt}] [MANUAL_VOICES:${manCnt}/2] [ALARM:${almCnt}]`;
}

ctxCanvas.fillStyle = '#000';
ctxCanvas.fillRect(0, 0, canvas.width, canvas.height);
</script>

</body>
</html>
