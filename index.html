<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATLITE SAP-Series Siren Amp Emulator (Precision Peak-Hold Model)</title>
    <style>
        :root {
            --panel-bg: #141519;
            --panel-border: #2a2c36;
            --card-bg: #1d1f27;
            --text-main: #f0f2f8;
            --text-sub: #828696;
            --accent-red: #ff3b30;
            --accent-red-glow: rgba(255, 59, 48, 0.4);
            --accent-blue: #0a84ff;
            --accent-blue-glow: rgba(10, 132, 255, 0.4);
            --accent-amber: #ff9f0a;
            --accent-amber-glow: rgba(255, 159, 10, 0.4);
            --accent-green: #30d158;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background-color: #08090b;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 840px;
        }

        .amp-panel {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        .header-title p {
            margin: 4px 0 0 0;
            font-size: 11px;
            color: var(--text-sub);
        }

        .status-badge {
            font-family: monospace;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #0b0c0e;
            border: 1px solid #1f212b;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .visualizer-card {
            background: #000000;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
        }

        canvas {
            width: 100%;
            height: 140px;
            display: block;
            border-radius: 4px;
        }

        .telemetry {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-sub);
        }

        .telemetry span {
            color: var(--text-main);
            font-weight: bold;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .control-group {
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group h2 {
            margin: 0;
            font-size: 11px;
            color: var(--text-sub);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        .btn {
            background: #252834;
            color: var(--text-main);
            border: 1px solid #383c4e;
            border-radius: 6px;
            padding: 14px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background: #2f3342;
            border-color: #4a4f66;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn small {
            font-size: 10px;
            font-weight: normal;
            color: var(--text-sub);
        }

        .btn-auto.active {
            background: #0f2b48;
            border-color: var(--accent-blue);
            color: #8ac0ff;
            box-shadow: 0 0 12px var(--accent-blue-glow);
        }

        .btn-manual {
            height: 100%;
            background: #3d1a1a;
            border-color: #662b2b;
            color: #ffb3b3;
        }

        .btn-manual:hover {
            background: #4d2222;
        }

        .btn-manual.active {
            background: #661818;
            border-color: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 0 16px var(--accent-red-glow);
        }

        .btn-alarm.active {
            background: #482f0f;
            border-color: var(--accent-amber);
            color: #ffd18a;
            box-shadow: 0 0 12px var(--accent-amber-glow);
        }

        .btn-stop {
            background: #281818;
            border-color: #522828;
            color: #ff9999;
        }

        .btn-stop:hover {
            background: #3d2020;
            color: #ffffff;
        }

        .footer-note {
            margin-top: 16px;
            font-size: 11px;
            color: var(--text-sub);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="amp-panel">
        <div class="header">
            <div class="header-title">
                <h1>ELECTRONIC SIREN AMPLIFIER</h1>
                <p>PATLITE SAP-Series Precision Peak-Hold Model</p>
            </div>
            <div class="status-badge">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">STANDBY</span>
            </div>
        </div>

        <div class="visualizer-card">
            <canvas id="canvas"></canvas>
            <div class="telemetry">
                <div>FREQ: <span id="telemetry-freq">0.0 Hz</span></div>
                <div>STATE: <span id="telemetry-mode">OFF</span></div>
                <div>AMP OUTPUT: <span id="telemetry-vol">0 %</span></div>
            </div>
        </div>

        <div class="controls-grid">
            <div class="control-group">
                <h2>自動周期 (AUTO)</h2>
                <button id="btn-auto-4" class="btn btn-auto">
                    4秒周期 (巡回)
                    <small>最高音4s保持 / 降下2s / 上昇2s</small>
                </button>
                <button id="btn-auto-8" class="btn btn-auto">
                    8秒周期 (高速)
                    <small>最高音8s保持 / 降下4s / 上昇4s</small>
                </button>
            </div>

            <div class="control-group">
                <h2>手動押下 (MANUAL)</h2>
                <button id="btn-manual" class="btn btn-manual">
                    手動サイレン (ウー)
                    <small>長押し: 上昇1.3s / 離す: 余韻3.5s</small>
                </button>
            </div>

            <div class="control-group">
                <h2>交差点警報 (OVERLAY)</h2>
                <button id="btn-alarm" class="btn btn-alarm">
                    交差点警報
                    <small>1200Hz+1550Hz (11.5Hz変調)</small>
                </button>
            </div>

            <div class="control-group">
                <h2>マスター制御</h2>
                <button id="btn-stop" class="btn btn-stop">
                    全音停止 (STOP)
                    <small>慣性降下即時キャンセル</small>
                </button>
            </div>
        </div>
    </div>

    <div class="footer-note">
        ※最高音(1350Hz)到達後に4秒/8秒保持し、その後指定秒数で下降・再上昇する最高音ホールド仕様。
    </div>
</div>

<script>
// 規格定数
const FREQ_MIN = 770.0;   // 最低周波数 (Hz)
const FREQ_MAX = 1350.0;  // 最高周波数 (Hz)
const FREQ_OFF = 0.01;    // 消音時ベース周波数 (Hz)

let audioCtx = null;
let masterGain = null;
let speakerFilterBank = null;
let analyser = null;

let mainSirenNode = null;
let intersectionAlarmNode = null;

let isAudioInitialized = false;

// スピーカーアンプフィルター
function createSpeakerEmulationFilter(ctx) {
    const input = ctx.createGain();
    const output = ctx.createGain();

    const hpf = ctx.createBiquadFilter();
    hpf.type = 'highpass';
    hpf.frequency.value = 400;
    hpf.Q.value = 0.7;

    const bpf = ctx.createBiquadFilter();
    bpf.type = 'peaking';
    bpf.frequency.value = 1800;
    bpf.gain.value = 6.0; 
    bpf.Q.value = 1.2;

    const lpf = ctx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 4500;
    lpf.Q.value = 0.7;

    input.connect(hpf);
    hpf.connect(bpf);
    bpf.connect(lpf);
    lpf.connect(output);

    return { input, output };
}

function initAudioEngine() {
    if (isAudioInitialized) return;

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();

    const limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -2.0;
    limiter.knee.value = 3.0;
    limiter.ratio.value = 20.0;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.05;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;

    speakerFilterBank = createSpeakerEmulationFilter(audioCtx);

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.0;

    speakerFilterBank.output.connect(limiter);
    limiter.connect(masterGain);
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    isAudioInitialized = true;
    updateStatus('READY', 'var(--accent-green)');
}

/**
 * 主波形オシレータ（最高音ホールド＋変調エンジン）
 */
class MainSirenEngine {
    constructor(ctx, destination) {
        this.ctx = ctx;
        this.destination = destination;

        this.outputGain = ctx.createGain();
        this.outputGain.gain.value = 0;
        this.outputGain.connect(destination);

        this.oscMain = ctx.createOscillator();
        this.oscMain.type = 'triangle';

        this.oscHarmonic = ctx.createOscillator();
        this.oscHarmonic.type = 'sawtooth';

        const harmonicGain = ctx.createGain();
        harmonicGain.gain.value = 0.18;

        this.oscMain.connect(this.outputGain);
        this.oscHarmonic.connect(harmonicGain).connect(this.outputGain);

        const now = ctx.currentTime;
        this.oscMain.start(now);
        this.oscHarmonic.start(now);

        this.mode = 'OFF'; 
        this.nextScheduleTime = 0;
        this.timerId = null;
    }

    getCurrentFrequency() {
        return this.oscMain.frequency.value;
    }

    setFreqInstant(freq, time) {
        const f = Math.max(FREQ_OFF, freq);
        this.oscMain.frequency.setValueAtTime(f, time);
        this.oscHarmonic.frequency.setValueAtTime(f, time);
    }

    linearRampFreq(freq, time) {
        const f = Math.max(FREQ_OFF, freq);
        this.oscMain.frequency.linearRampToValueAtTime(f, time);
        this.oscHarmonic.frequency.linearRampToValueAtTime(f, time);
    }

    setTargetFreq(freq, time, timeConstant) {
        const f = Math.max(FREQ_OFF, freq);
        this.oscMain.frequency.setTargetAtTime(f, time, timeConstant);
        this.oscHarmonic.frequency.setTargetAtTime(f, time, timeConstant);
    }

    cancelSchedules() {
        const now = this.ctx.currentTime;
        this.oscMain.frequency.cancelScheduledValues(now);
        this.oscHarmonic.frequency.cancelScheduledValues(now);
        this.outputGain.gain.cancelScheduledValues(now);
        if (this.timerId) {
            clearTimeout(this.timerId);
            this.timerId = null;
        }
    }

    // --- 自動周期 (最高音キープ 4秒 / 8秒 モード) ---
    startAutoCycle(cycleSec) {
        this.cancelSchedules();
        this.mode = (cycleSec === 4) ? 'AUTO 4S' : 'AUTO 8S';

        const now = this.ctx.currentTime;
        const currentF = this.getCurrentFrequency();
        const sweepDuration = cycleSec / 2.0; // 4sモード: 変調2.0s / 8sモード: 変調4.0s
        const holdDuration = cycleSec;        // 最高音(1350Hz)を維持する時間 (4秒 または 8秒)

        // 音量ON
        this.outputGain.gain.setValueAtTime(this.outputGain.gain.value, now);
        this.outputGain.gain.linearRampToValueAtTime(1.0, now + 0.03);

        // 最初の一回り：現在のピッチから最高音(1350Hz)へ上昇
        let startF = (currentF < FREQ_MIN + 5) ? FREQ_MIN : currentF;
        if (startF > FREQ_MAX) startF = FREQ_MAX;

        const initialRiseDuration = ((FREQ_MAX - startF) / (FREQ_MAX - FREQ_MIN)) * sweepDuration;

        this.setFreqInstant(startF, now);
        this.linearRampFreq(FREQ_MAX, now + initialRiseDuration);

        // 最高音(1350Hz)に達した瞬間からループを開始
        let tPeak = now + initialRiseDuration;
        this.nextScheduleTime = tPeak;

        const scheduleLoop = () => {
            if (this.mode !== 'AUTO 4S' && this.mode !== 'AUTO 8S') return;

            const t = this.ctx.currentTime;

            while (this.nextScheduleTime < t + 2.0) {
                const tStart = this.nextScheduleTime;

                // 1. 最高音(1350Hz)を holdDuration (4秒/8秒) 間キープ
                this.setFreqInstant(FREQ_MAX, tStart);
                const tStartDrop = tStart + holdDuration;
                this.setFreqInstant(FREQ_MAX, tStartDrop);

                // 2. そこから 1350Hz -> 770Hz へ (2秒/4秒) かけて直線下降
                const tBottom = tStartDrop + sweepDuration;
                this.linearRampFreq(FREQ_MIN, tBottom);

                // 3. 770Hz -> 1350Hz へ (2秒/4秒) かけて直線上昇
                const tNextPeak = tBottom + sweepDuration;
                this.linearRampFreq(FREQ_MAX, tNextPeak);

                // 次の最高音開始ポイントへ進行
                this.nextScheduleTime = tNextPeak;
            }
            this.timerId = setTimeout(scheduleLoop, 200);
        };

        scheduleLoop();
    }

    startManualPress() {
        this.cancelSchedules();
        this.mode = 'MANUAL (WOO)';

        const now = this.ctx.currentTime;
        let currentF = this.getCurrentFrequency();
        if (currentF < FREQ_MIN) currentF = FREQ_MIN;

        this.outputGain.gain.setValueAtTime(this.outputGain.gain.value, now);
        this.outputGain.gain.linearRampToValueAtTime(1.0, now + 0.03);

        this.setFreqInstant(currentF, now);
        this.setTargetFreq(FREQ_MAX, now, 0.35); // 1.3秒で1350Hzへ到達
    }

    stopWithInertia() {
        if (this.mode === 'OFF' || this.mode === 'INERTIA') return;

        this.cancelSchedules();
        this.mode = 'INERTIA';

        const now = this.ctx.currentTime;
        const currentF = this.getCurrentFrequency();

        this.setFreqInstant(currentF, now);
        this.setTargetFreq(FREQ_MIN, now, 0.85); // 3.5秒かけて慣性降下

        this.outputGain.gain.setValueAtTime(this.outputGain.gain.value, now);
        this.outputGain.gain.setTargetAtTime(0.0, now, 0.9);

        this.timerId = setTimeout(() => {
            this.mode = 'OFF';
            this.setFreqInstant(FREQ_MIN, this.ctx.currentTime);
        }, 3600);
    }

    killImmediately() {
        this.cancelSchedules();
        this.mode = 'OFF';
        const now = this.ctx.currentTime;
        this.outputGain.gain.setValueAtTime(0, now);
        this.setFreqInstant(FREQ_MIN, now);
    }
}

/**
 * 交差点警報音 (1200Hz + 1550Hz)
 */
class IntersectionAlarmEngine {
    constructor(ctx, destination) {
        this.ctx = ctx;
        this.destination = destination;

        this.mainGain = ctx.createGain();
        this.mainGain.gain.value = 0;
        this.mainGain.connect(destination);

        this.lfo = ctx.createOscillator();
        this.lfo.type = 'square';
        this.lfo.frequency.value = 11.5;

        const lfoGain = ctx.createGain();
        lfoGain.gain.value = 0.5;

        const dcOffset = ctx.createConstantSource();
        dcOffset.offset.value = 0.5;

        const modGain = ctx.createGain();
        modGain.gain.value = 0;

        this.lfo.connect(lfoGain);
        lfoGain.connect(modGain.gain);
        dcOffset.connect(modGain.gain);
        modGain.connect(this.mainGain);

        const freqs = [1200, 1550];
        this.oscs = freqs.map(f => {
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = f;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = f;
            filter.Q.value = 3.0;

            osc.connect(filter).connect(modGain);
            return osc;
        });

        const now = ctx.currentTime;
        this.lfo.start(now);
        dcOffset.start(now);
        this.oscs.forEach(o => o.start(now));

        this.isActive = false;
    }

    start() {
        const now = this.ctx.currentTime;
        this.mainGain.gain.cancelScheduledValues(now);
        this.mainGain.gain.setValueAtTime(this.mainGain.gain.value, now);
        this.mainGain.gain.linearRampToValueAtTime(0.7, now + 0.03);
        this.isActive = true;
    }

    stop() {
        const now = this.ctx.currentTime;
        this.mainGain.gain.cancelScheduledValues(now);
        this.mainGain.gain.setValueAtTime(this.mainGain.gain.value, now);
        this.mainGain.gain.linearRampToValueAtTime(0, now + 0.05);
        this.isActive = false;
    }
}

// UIバインド
const btnAuto4 = document.getElementById('btn-auto-4');
const btnAuto8 = document.getElementById('btn-auto-8');
const btnManual = document.getElementById('btn-manual');
const btnAlarm = document.getElementById('btn-alarm');
const btnStop = document.getElementById('btn-stop');

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

const telemetryFreq = document.getElementById('telemetry-freq');
const telemetryMode = document.getElementById('telemetry-mode');
const telemetryVol = document.getElementById('telemetry-vol');

function updateStatus(text, color) {
    statusText.textContent = text;
    statusDot.style.backgroundColor = color;
    statusDot.style.boxShadow = `0 0 8px ${color}`;
}

function clearActiveUI() {
    btnAuto4.classList.remove('active');
    btnAuto8.classList.remove('active');
    btnManual.classList.remove('active');
}

function ensureAudioReady() {
    initAudioEngine();
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    if (!mainSirenNode) {
        mainSirenNode = new MainSirenEngine(audioCtx, speakerFilterBank.input);
    }
    if (!intersectionAlarmNode) {
        intersectionAlarmNode = new IntersectionAlarmEngine(audioCtx, speakerFilterBank.input);
    }
}

function handleAutoToggle(cycleSec) {
    ensureAudioReady();
    const isTarget4 = (cycleSec === 4);
    const targetBtn = isTarget4 ? btnAuto4 : btnAuto8;
    const isAlreadyActive = targetBtn.classList.contains('active');

    if (isAlreadyActive) {
        mainSirenNode.stopWithInertia();
        clearActiveUI();
    } else {
        clearActiveUI();
        targetBtn.classList.add('active');
        mainSirenNode.startAutoCycle(cycleSec);
    }
}

btnAuto4.addEventListener('click', () => handleAutoToggle(4));
btnAuto8.addEventListener('click', () => handleAutoToggle(8));

function handleManualStart() {
    ensureAudioReady();
    if (btnManual.classList.contains('active')) return;
    clearActiveUI();
    btnManual.classList.add('active');
    mainSirenNode.startManualPress();
}

function handleManualRelease() {
    if (!btnManual.classList.contains('active')) return;
    btnManual.classList.remove('active');
    if (mainSirenNode) {
        mainSirenNode.stopWithInertia();
    }
}

btnManual.addEventListener('mousedown', handleManualStart);
btnManual.addEventListener('mouseup', handleManualRelease);
btnManual.addEventListener('mouseleave', handleManualRelease);

btnManual.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleManualStart();
}, { passive: false });

btnManual.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleManualRelease();
}, { passive: false });

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        handleManualStart();
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        handleManualRelease();
    }
});

btnAlarm.addEventListener('click', () => {
    ensureAudioReady();
    if (intersectionAlarmNode.isActive) {
        intersectionAlarmNode.stop();
        btnAlarm.classList.remove('active');
    } else {
        intersectionAlarmNode.start();
        btnAlarm.classList.add('active');
    }
});

btnStop.addEventListener('click', () => {
    if (!isAudioInitialized) return;
    clearActiveUI();
    btnAlarm.classList.remove('active');
    if (mainSirenNode) mainSirenNode.killImmediately();
    if (intersectionAlarmNode) intersectionAlarmNode.stop();
});

// Canvas オシロスコープ描画
const canvas = document.getElementById('canvas');
const canvasCtx = canvas.getContext('2d');

function renderVisualizer() {
    requestAnimationFrame(renderVisualizer);

    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvasCtx.scale(dpr, dpr);
    }

    const w = rect.width;
    const h = rect.height;

    canvasCtx.fillStyle = '#050608';
    canvasCtx.fillRect(0, 0, w, h);

    canvasCtx.strokeStyle = '#141720';
    canvasCtx.lineWidth = 1;
    for (let x = 0; x < w; x += 30) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(x, 0);
        canvasCtx.lineTo(x, h);
        canvasCtx.stroke();
    }
    for (let y = 0; y < h; y += 20) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, y);
        canvasCtx.lineTo(w, y);
        canvasCtx.stroke();
    }

    if (!analyser) return;

    const bufferLength = analyser.frequencyBinCount;
    const timeData = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(timeData);

    canvasCtx.lineWidth = 2;
    canvasCtx.strokeStyle = '#30d158';
    canvasCtx.shadowBlur = 8;
    canvasCtx.shadowColor = 'rgba(48, 209, 88, 0.5)';
    canvasCtx.beginPath();

    const sliceWidth = w / bufferLength;
    let x = 0;

    for (let i = 0; i < bufferLength; i++) {
        const v = timeData[i] / 128.0;
        const y = (v * h) / 2;

        if (i === 0) {
            canvasCtx.moveTo(x, y);
        } else {
            canvasCtx.lineTo(x, y);
        }
        x += sliceWidth;
    }

    canvasCtx.lineTo(w, h / 2);
    canvasCtx.stroke();
    canvasCtx.shadowBlur = 0;

    if (mainSirenNode) {
        const freq = (mainSirenNode.mode === 'OFF') ? 0 : mainSirenNode.getCurrentFrequency();
        telemetryFreq.textContent = `${freq.toFixed(1)} Hz`;
        telemetryMode.textContent = mainSirenNode.mode;

        const vol = Math.round(mainSirenNode.outputGain.gain.value * 100);
        telemetryVol.textContent = `${vol} %`;

        if (mainSirenNode.mode !== 'OFF' || (intersectionAlarmNode && intersectionAlarmNode.isActive)) {
            updateStatus('TRANSMITTING', 'var(--accent-red)');
        } else {
            updateStatus('READY', 'var(--accent-green)');
        }
    }
}

renderVisualizer();
</script>
</body>
</html>
